[pytest]
testpaths = tests
pythonpath = tests

markers =
    integration: Full integration tests that create real AWS resources (costs money)
    smoke: Quick smoke tests that validate notebook structure and imports
    classification: Tests for medical-image-classification notebooks
    segmentation: Tests for medical-image-segmentation notebooks
    training: Tests that launch SageMaker training jobs
    deployment: Tests that deploy SageMaker endpoints
    preprocessing: Tests for data preprocessing notebooks
    expensive: Tests that incur significant AWS costs (GPU instances, endpoints)

# Default options
addopts = -v --tb=short

# Timeout per test (seconds) - training jobs can take 20+ minutes
timeout = 2400
